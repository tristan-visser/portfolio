<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Source+Sans+3:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
      }
      body {
        background: #f3eee5;
        color: #171614;
        font-family: 'Source Sans 3', system-ui, sans-serif;
        overflow: hidden;
        position: relative;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(23, 22, 20, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(23, 22, 20, 0.05) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: linear-gradient(to bottom, black, transparent 78%);
      }
      .wrap {
        position: relative;
        padding: 58px 68px 52px;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
        font-size: 13px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #6d675e;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #171614;
      }
      .mark {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        background: #171614;
        color: #f3eee5;
        font-family: Georgia, serif;
        font-size: 18px;
        letter-spacing: 0;
      }
      .main {
        margin-top: auto;
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(0, 0.7fr);
        gap: 60px;
        align-items: end;
      }
      .eyebrow {
        font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6d675e;
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 0 0 22px;
      }
      .eyebrow::before {
        content: '';
        width: 38px;
        height: 1px;
        background: #b4432a;
      }
      h1 {
        font-family: 'Newsreader', Georgia, serif;
        font-weight: 400;
        font-size: 142px;
        line-height: 0.8;
        letter-spacing: -0.06em;
        margin: 0;
      }
      h1 em {
        color: #b4432a;
        font-style: italic;
      }
      .aside {
        padding-bottom: 8px;
        font-size: 23px;
        line-height: 1.45;
        color: #2a2723;
        max-width: 24ch;
      }
      .aside strong {
        font-weight: 600;
      }
      .foot {
        margin-top: 36px;
        padding-top: 18px;
        border-top: 1px solid rgba(23, 22, 20, 0.18);
        display: flex;
        justify-content: space-between;
        font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #6d675e;
      }
      .foot .accent {
        color: #8f3320;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="wrap">
      <div class="top">
        <div class="brand">
          <span class="mark" aria-hidden="true">
            <svg width="38" height="38" viewBox="0 0 64 64">
              <rect width="64" height="64" fill="#171614" />
              <rect x="12" y="12" width="40" height="6" fill="#f3eee5" />
              <rect x="29" y="12" width="6" height="24" fill="#f3eee5" />
              <polygon points="29,34 35,34 19,52 13,52" fill="#f3eee5" />
              <polygon points="29,34 35,34 51,52 45,52" fill="#f3eee5" />
            </svg>
          </span>
          Tristan Visser
        </div>
        <span>tristanvisser.co.za</span>
      </div>
      <div class="main">
        <div>
          <p class="eyebrow">BSc Computer Science · Stellenbosch University · 2026</p>
          <h1>Tristan<br /><em>Visser</em></h1>
        </div>
        <p class="aside">
          <strong>Final-year computer science student</strong> building backend systems and
          full-stack products.
        </p>
      </div>
      <div class="foot">
        <span>Stellenbosch, South Africa</span>
        <span class="accent">Open to graduate roles · 2027</span>
      </div>
    </div>
  </body>
</html>
