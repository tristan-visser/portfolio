<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">MCTS search speed by MPI process count</title>
  <desc id="desc">A line chart showing average nodes per second rising from 432,674 with one process to 1,338,165 with eight processes.</desc>

  <text x="0" y="28" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#171614">
    MCTS search speed by process count
  </text>
  <text x="0" y="52" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#6d675e">
    10-RUN ENSEMBLE · 4.0s PER MOVE · OTHELLO
  </text>

  <g stroke="#171614" stroke-opacity="0.12" stroke-width="1">
    <line x1="80" y1="340" x2="840" y2="340"/>
    <line x1="80" y1="276" x2="840" y2="276"/>
    <line x1="80" y1="212" x2="840" y2="212"/>
    <line x1="80" y1="148" x2="840" y2="148"/>
    <line x1="80" y1="84" x2="840" y2="84"/>
  </g>

  <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" fill="#6d675e">
    <text x="68" y="344" text-anchor="end">0</text>
    <text x="68" y="280" text-anchor="end">320k</text>
    <text x="68" y="216" text-anchor="end">640k</text>
    <text x="68" y="152" text-anchor="end">960k</text>
    <text x="68" y="88" text-anchor="end">1.28M</text>
  </g>

  <line x1="80" y1="80" x2="80" y2="340" stroke="#171614" stroke-width="1"/>
  <line x1="80" y1="340" x2="840" y2="340" stroke="#171614" stroke-width="1"/>

  <polyline
    points="120,253.5 313.3,215.2 506.7,194.7 840,72.4"
    fill="none"
    stroke="#b4432a"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <g fill="#b4432a" stroke="#f3eee5" stroke-width="3">
    <circle cx="120" cy="253.5" r="6"/>
    <circle cx="313.3" cy="215.2" r="6"/>
    <circle cx="506.7" cy="194.7" r="6"/>
    <circle cx="840" cy="72.4" r="6"/>
  </g>

  <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#171614">
    <text x="120" y="237" text-anchor="middle">432k</text>
    <text x="313.3" y="199" text-anchor="middle">625k</text>
    <text x="506.7" y="178" text-anchor="middle">727k</text>
    <text x="840" y="56" text-anchor="middle">1.34M</text>
  </g>

  <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" fill="#6d675e">
    <text x="120" y="366" text-anchor="middle">1</text>
    <text x="313.3" y="366" text-anchor="middle">2</text>
    <text x="506.7" y="366" text-anchor="middle">4</text>
    <text x="840" y="366" text-anchor="middle">8</text>
  </g>

  <text x="460" y="402" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" fill="#6d675e">
    MPI RANKS · 8 RANKS REACHED 204M SIMULATIONS PER TURN
  </text>
</svg>
