<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">WISTL compiler pipeline</title>
  <desc id="desc">A left-to-right pipeline from WISTL source through a scanner, LL(1) parser, symbol table and type checker, JVM code generation, to a class file.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#171614"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <g fill="#f3eee5" stroke="#171614" stroke-width="1">
      <rect x="30" y="100" width="140" height="80"/>
      <rect x="190" y="100" width="140" height="80"/>
      <rect x="350" y="100" width="140" height="80"/>
      <rect x="510" y="100" width="140" height="80"/>
      <rect x="670" y="100" width="140" height="80"/>
      <rect x="830" y="100" width="140" height="80" stroke="#b4432a"/>
    </g>

    <g font-size="15" fill="#171614" text-anchor="middle">
      <text x="100" y="136">WISTL</text>
      <text x="100" y="156">source</text>
      <text x="260" y="136">Scanner</text>
      <text x="260" y="156">lexer</text>
      <text x="420" y="136">LL(1)</text>
      <text x="420" y="156">parser</text>
      <text x="580" y="132">Symbol table</text>
      <text x="580" y="152">+ type checker</text>
      <text x="740" y="136">JVM code</text>
      <text x="740" y="156">generation</text>
      <text x="900" y="136">.class</text>
      <text x="900" y="156">file</text>
    </g>

    <g stroke="#171614" stroke-width="1" marker-end="url(#arrow)">
      <line x1="170" y1="140" x2="186" y2="140"/>
      <line x1="330" y1="140" x2="346" y2="140"/>
      <line x1="490" y1="140" x2="506" y2="140"/>
      <line x1="650" y1="140" x2="666" y2="140"/>
      <line x1="810" y1="140" x2="826" y2="140"/>
    </g>

    <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="9" fill="#6d675e" text-anchor="middle" letter-spacing="1">
      <text x="178" y="86">TOKENS</text>
      <text x="338" y="86">AST</text>
      <text x="498" y="86">TYPED AST</text>
      <text x="658" y="86">BYTECODE</text>
      <text x="818" y="86">CLASS</text>
    </g>

    <text x="500" y="232" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="10" fill="#6d675e" letter-spacing="1">
      C IMPLEMENTATION · LL(1) GRAMMAR · JVM TARGET
    </text>
  </g>
</svg>
